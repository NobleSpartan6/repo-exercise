[package]
name = "burrow"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A small, local-first desktop cleaner and disk explorer"
license = "MIT"
repository = "https://github.com/NobleSpartan6/burrow"

[features]
default = ["desktop"]
desktop = ["dep:ab_glyph", "dep:image", "dep:eframe", "dep:rfd", "dep:sysinfo", "dep:wgpu"]

[[bin]]
name = "burrow"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
ab_glyph = { version = "=0.2.32", optional = true }
dirs = "=6.0.0"
walkdir = "=2.5.0"
rayon = "=1.11.0"
trash = "=5.2.6"
eframe = { version = "=0.33.0", optional = true, default-features = false, features = ["default_fonts", "accesskit"] }
rfd = { version = "=0.15.4", optional = true }
sysinfo = { version = "=0.36.1", optional = true, default-features = false, features = ["system", "disk"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
eframe = { version = "=0.33.0", optional = true, default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
eframe = { version = "=0.33.0", optional = true, default-features = false, features = ["glow", "x11", "wayland"] }

[dev-dependencies]
tempfile = "=3.22.0"
filetime = "=0.2.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
