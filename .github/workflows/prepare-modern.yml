name: Prepare reviewed modern native source
on:
  push:
    branches: ['release-prep/0.2.0-modern']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Prepare formatted blobs for review without updating branches or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('.github/prepare-modern.py').read_text().split("tree=api('git/trees'")[0]
          code += "\nprint('PREPARED_BASE='+base, flush=True)\nprint('PREPARED_ENTRIES='+json.dumps(entries), flush=True)\n"
          exec(compile(code, '.github/prepare-modern.py', 'exec'))
          PY
