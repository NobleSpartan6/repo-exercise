name: Prepare and test Burrow 0.3 workspaces
on:
  push:
    branches: ['release-prep/0.3.0-workspaces']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply hash-verified source delta
        run: python3 .github/staging/prepare.py
      - name: Install pinned compiler
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Format and resolve reviewed dependency additions
        run: |
          cargo fmt --all
          cargo metadata --format-version 1 > dependency-metadata.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Export prepared source without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, subprocess, zipfile
          from pathlib import Path
          def post(endpoint,value):
              return json.loads(subprocess.check_output(['gh','api','--method','POST','repos/NobleSpartan6/burrow/'+endpoint,'--input','-'],input=json.dumps(value).encode()))
          entries=[]
          paths=json.loads(Path('.github/staging/paths.json').read_text())
          for name in paths:
              blob=post('git/blobs',{'content':base64.b64encode(Path(name).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('git/trees',{'base_tree':'27fbf3d9140c762de54a46154168cf7a9f3a3079','tree':entries})
          Path('prepared-entries.json').write_text(json.dumps(entries,indent=2))
          print('PREPARED_TREE='+tree['sha'],flush=True)
          with zipfile.ZipFile('prepared-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in paths: archive.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-030-source
          path: |
            prepared-source.zip
            prepared-entries.json
          if-no-files-found: error
      - name: Install signed Ubuntu graphics dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 -o APT::Update::Error-Mode=any)
          timeout 240s sudo apt-get "${opts[@]}" update
          timeout 240s sudo apt-get "${opts[@]}" install -y libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dri
      - name: Native feature preflight
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-default-features --lib
