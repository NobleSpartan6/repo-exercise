name: Publish staged Broom source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-staged-tree.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-staged-broom-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Attach the staged source tree to main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_TREE: f15ec5a18d177c64f19ed8d2ab090723ab365231
        shell: bash
        run: |
          set -euo pipefail

          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main moved after this workflow started; refusing to overwrite it" >&2
            exit 1
          fi

          commit="$({
            jq -n \
              --arg message 'feat: launch Broom desktop cleaner for macOS and Windows' \
              --arg tree "$STAGED_TREE" \
              --arg parent "$GITHUB_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}'
          } | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha')"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="$commit" \
            -F force=false >/dev/null

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Published staged tree $STAGED_TREE as $commit"

      - name: Dispatch source verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched=0
          for workflow in ci.yml build.yml build-installers.yml installers.yml; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/${workflow}?ref=main" >/dev/null 2>&1; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -f ref=main
              echo "Dispatched ${workflow}"
              dispatched=1
            fi
          done

          if [[ "$dispatched" -eq 0 ]]; then
            echo "No workflow_dispatch-enabled verification file was found; source publication still succeeded."
          fi
