name: Inspect native renderer build diagnostic
on:
  push:
    branches: ['release-prep/0.2.0-diagnostics']
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the completed Windows job directly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api repos/NobleSpartan6/burrow/actions/jobs/102281541609/logs | tail -100
