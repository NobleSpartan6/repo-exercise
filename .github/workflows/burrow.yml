name: Burrow — build, test and package

on:
  push:
    branches: [main, 'burrow/**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'examples/**'
      - 'docs/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/burrow.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'SECURITY.md'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish an unsigned preview after every check passes (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: burrow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve one shared dependency lock and source bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the pinned Rust compiler
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Resolve dependencies once for all platforms
        run: |
          test -f Cargo.lock
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo metadata --locked --format-version 1 > dependency-metadata.json
          python3 scripts/package.py notices
          python3 scripts/package.py source
      - uses: actions/upload-artifact@v4
        with:
          name: locked-inputs
          path: |
            Cargo.lock
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: dist/*-source.zip
          if-no-files-found: error

  build:
    name: Test and build ${{ matrix.label }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-AppleSilicon
            package: apple-silicon
          - os: macos-15-intel
            label: macOS-Intel
            package: intel
          - os: windows-2022
            label: Windows-x64
            package: windows
          - os: ubuntu-24.04
            label: Linux-QA-only
            package: qa
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: locked-inputs
          path: .
      - name: Install pinned compiler and Clippy
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy
      - name: Install Linux graphics and smoke-test utilities
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dri xvfb xdotool scrot fonts-dejavu-core
      - name: Test packaging and release metadata
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Run unit tests on this operating system
        run: cargo test --locked --all-targets
      - name: Verify one disposable native Trash round trip
        if: runner.os != 'Linux'
        run: cargo test --locked --lib engine::native_tests::native_trash_roundtrip -- --ignored --exact
      - name: Check Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build optimized native executable
        run: cargo build --locked --release
      - name: Run the native GUI and exercise navigation
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1200x900x24' python3 scripts/smoke_gui.py
      - name: Measure a synthetic metadata scan
        if: runner.os == 'Linux'
        run: cargo run --locked --release --example scan_bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package macOS drag-and-drop installer
        if: runner.os == 'macOS'
        run: python3 scripts/package.py macos '${{ matrix.package }}'
      - name: Package Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: python scripts/package.py windows
      - name: Fetch verified old Windows installer
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.1-preview-f30ef4f --pattern '*Setup.exe' --dir "$RUNNER_TEMP/old-burrow"
      - name: Test Windows installation upgrade launch and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BURROW_OLD_INSTALLER = (Get-ChildItem "$env:RUNNER_TEMP/old-burrow/*Setup.exe").FullName
          python scripts/verify_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test copied Mac application from disk image
        if: runner.os == 'macOS'
        run: python3 scripts/verify_install.py '${{ matrix.package }}'
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: installer-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-QA-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: warn

  release:
    name: Publish an explicitly unsigned preview
    needs: [resolve, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_preview == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-bundle
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: locked-inputs
          path: dist
      - name: Publish versioned assets only after all platform jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/package.py version)"
          tag="v${version}-preview-${GITHUB_SHA::7}"
          if draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$draft" = "true" ]; then
              echo "An unfinished draft exists for this commit. Inspect it before retrying publication." >&2
              exit 1
            fi
            echo "This source commit already has a published release; not overwriting assets."
            exit 0
          fi
          python3 scripts/package.py verify-release
          python3 scripts/package.py checksums
          cp docs/RELEASE_NOTES.md /tmp/burrow-release.md
          printf '\nSource commit: `%s`\n\nBuild run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/burrow-release.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "Burrow ${version} preview (${GITHUB_SHA::7})" \
            --notes-file /tmp/burrow-release.md --prerelease --draft
          gh release edit "$tag" --draft=false
